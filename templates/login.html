<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    .login-page {
      min-height: 100vh;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      display: flex;
      width: 100%;
      max-width: 820px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    /* Left panel */
    .login-left {
      background: #FFD100;
      padding: 48px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-left h1 {
      font-size: 30px;
      font-weight: 900;
      color: #1A1A1A;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .login-left p {
      font-size: 13px;
      color: rgba(0,0,0,0.6);
      line-height: 1.6;
    }

    /* Right panel */
    .login-right {
      background: #FFFFFF;
      padding: 48px 40px;
      width: 340px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right h2 { font-size: 22px; font-weight: 800; color: #1A1A1A; margin-bottom: 4px; }
    .login-right .login-sub { font-size: 13px; color: #777; margin-bottom: 28px; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E0E0E0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #FFD100; }
    .form-input::placeholder { color: #AAAAAA; }

    .btn-login {
      width: 100%;
      background: #1A1A1A;
      color: #FFD100;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-login:hover { background: #333333; }

    .error-msg {
      background: #FFE8E3;
      color: #C0392B;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hint-box {
      margin-top: 24px;
      padding: 14px;
      background: #F9F9F9;
      border-radius: 8px;
      font-size: 12px;
      color: #888;
      line-height: 1.8;
    }
    .hint-box strong { color: #1A1A1A; }

    @media (max-width: 640px) {
      .login-wrap { flex-direction: column; }
      .login-right { width: 100%; }
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-wrap">

    <!-- Left -->
    <div class="login-left">
      <img src="/static/LOGO_AND_NAME.png" alt="SENSE Student Portal"
           style="max-width:260px; height:auto; margin-bottom:32px;" />
      <h1>Every feedback<br>shapes better<br>education.</h1>
      <p style="margin-top:12px;">Sentiment Faculty Evaluation Analysis System.<br>Safe, anonymous, and constructive.</p>
    </div>

    <!-- Right -->
    <div class="login-right">
      <h2>Sign In</h2>
      <p class="login-sub">Enter your credentials to continue.</p>

      {% if error %}
      <div class="error-msg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" flex-shrink="0">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" name="username"
                 placeholder="Enter your username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <button class="btn-login" type="submit">Sign in →</button>
      </form>

      <div class="hint-box">
        <strong>Demo credentials:</strong><br>
        Student: <strong>student</strong> / <strong>student123</strong><br>
        Program Chair: <strong>programchair</strong> / <strong>chair123</strong>
      </div>
    </div>

  </div>
</div>
</body>
</html>
