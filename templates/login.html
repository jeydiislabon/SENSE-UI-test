<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #0F0F2D 0%, #1A1240 50%, #16073A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .login-logo-box {
      width: 40px; height: 40px;
      background: var(--purple);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .login-logo-name { font-size: 18px; font-weight: 800; color: var(--text-primary); }
    .login-logo-sub  { font-size: 11px; color: var(--text-muted); }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }
    .form-input:focus { border-color: var(--purple); }
    .form-input::placeholder { color: var(--text-muted); }

    .btn-login {
      width: 100%;
      background: var(--purple);
      color: #fff;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 8px;
      transition: background 0.2s, transform 0.15s;
      border: none;
      cursor: pointer;
    }
    .btn-login:hover { background: var(--purple-dark); transform: translateY(-1px); }

    .error-msg {
      background: #FFE8E3;
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--purple);
      font-weight: 500;
    }

    .login-note {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-box">💬</div>
      <div>
        <div class="login-logo-name">Sense</div>
        <div class="login-logo-sub">Student Portal</div>
      </div>
    </div>

    <h1 class="login-title">Admin Login</h1>
    <p class="login-subtitle">Authorized personnel only. Student feedback submission does not require login.</p>

    <!-- Error -->
    {% if error %}
    <div class="error-msg">⚠ {{ error }}</div>
    {% endif %}

    <!-- Form -->
    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="Enter your username" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Enter your password" autocomplete="current-password" required />
      </div>

      <button class="btn-login" type="submit">Sign in →</button>
    </form>

    <div class="login-footer">
      <a href="/">← Back to welcome page</a>
    </div>

    <div class="login-note">
      🔒 This dashboard is for authorized academic administrators only.<br>
      Student feedback is kept anonymous and confidential.
    </div>

  </div>
</div>
</body>
</html>
